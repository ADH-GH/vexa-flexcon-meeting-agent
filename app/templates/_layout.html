<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meeting Agent{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; --dim: #8888; }
    * { box-sizing: border-box; }
    body { font: 15px/1.55 system-ui, -apple-system, sans-serif; margin: 0; }
    header { padding: 12px 22px; border-bottom: 1px solid var(--line); display: flex;
             gap: 18px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav a { padding: 5px 10px; border-radius: 7px; color: inherit; text-decoration: none; opacity: .7; }
    nav a:hover { background: #8882; }
    nav a.on { opacity: 1; background: #8883; font-weight: 600; }
    .who { margin-left: auto; font-size: 13px; opacity: .6; }
    .who a { color: inherit; }
    main { padding: 24px; max-width: 1080px; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    p.sub { opacity: .6; margin: 0 0 20px; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 13px 17px; min-width: 120px; }
    .card b { font-size: 24px; display: block; line-height: 1.2; }
    .card span { opacity: .6; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #8882; vertical-align: top; }
    th { font-size: 13px; opacity: .7; font-weight: 600; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #8883; white-space: nowrap; }
    .muted { opacity: .55; }
    form.stack { display: grid; gap: 16px; max-width: 620px; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
    legend { font-weight: 600; padding: 0 6px; }
    label.row { display: grid; grid-template-columns: 1fr 190px; gap: 12px; align-items: center;
                padding: 6px 0; }
    input[type=text], input[type=number], textarea, select {
      padding: 7px 9px; border: 1px solid #8885; border-radius: 7px; background: transparent;
      color: inherit; font: inherit; width: 100%; }
    textarea { min-height: 190px; font-family: ui-monospace, monospace; font-size: 13px; }
    button, .btn { padding: 8px 15px; border: 0; border-radius: 7px; background: #2563eb; color: #fff;
                   font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
                   display: inline-block; }
    button.ghost { background: transparent; border: 1px solid #8886; color: inherit; font-weight: 500; }
    .ok { background: #16a34a22; border: 1px solid #16a34a66; padding: 9px 13px; border-radius: 8px;
          margin-bottom: 16px; }
    .key { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .prev { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
    @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>🎙️ Meeting Agent</h1>
    <nav>
      <a href="/" class="{{ 'on' if nav == 'meetings' }}">Meetings</a>
      <a href="/settings" class="{{ 'on' if nav == 'settings' }}">Einstellungen</a>
      <a href="/templates" class="{{ 'on' if nav == 'templates' }}">Mail-Vorlagen</a>
      <a href="/insights" class="{{ 'on' if nav == 'insights' }}">Insights &amp; Reports</a>
      <a href="/plan" class="{{ 'on' if nav == 'plan' }}">Plan &amp; Nutzung</a>
      <a href="/connector" class="{{ 'on' if nav == 'connector' }}">Agent Connector</a>
      <a href="/health">Health</a>
    </nav>
    <span class="who">
      {% if tenant %}{{ tenant.name }} · {% endif %}{{ principal.email if principal else "" }}
      · <a href="/auth/logout">Logout</a>
    </span>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
